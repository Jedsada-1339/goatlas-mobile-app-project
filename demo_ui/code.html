<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Trip - Professional Variant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0EA5E9",
                        "background-light": "#F8FAFC",
                        "background-dark": "#0F172A",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<div class="w-full max-w-md bg-white dark:bg-slate-900 min-h-screen shadow-2xl relative flex flex-col overflow-hidden">
<div class="h-12 w-full"></div>
<header class="px-6 py-4 flex items-center justify-between sticky top-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-icons-round text-slate-600 dark:text-slate-300">chevron_left</span>
</button>
<h1 class="text-lg font-semibold tracking-tight">Create New Trip</h1>
<div class="w-10"></div> 
</header>
<main class="flex-1 overflow-y-auto px-6 pb-32 no-scrollbar">
<div class="relative w-full aspect-[16/9] mt-2 rounded-3xl overflow-hidden shadow-lg group">
<img alt="Scenic mountain landscape" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_ibFwOVCNk5eCjl8uBlNPQ587YFFj3ppkREDHYNSAIJ4Yv01mPw2soS8N6uu4BDPVjk-mdUJ5kpGwyiI07KUrV682LMR00uzUR_8NtLvxGxJmpHTbYv0CRZmUc3NOsE0884GkmYd-I7vFKpp8CSkCnUMxLYed_teIAzquMrDzl_4hSDvU_Zfw2OngEbTI4ie6jDXCYmooEqEUuPIW5Y0A34VLj9ETXNLD_IuUdWBQL6yGl_I5pQJ-R_aVpyOsGDgY2GBZsq-9RmH4"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<button class="absolute bottom-4 right-4 bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm px-4 py-2 rounded-full flex items-center gap-2 text-sm font-medium shadow-sm active:scale-95 transition-all">
<span class="material-icons-round text-sm">edit</span>
<span>Change Cover</span>
</button>
</div>
<div class="mt-8">
<label class="block text-sm font-semibold text-slate-500 dark:text-slate-400 mb-2 ml-1">TRIP NAME</label>
<input class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-2xl px-5 py-4 text-base focus:ring-2 focus:ring-primary/50 placeholder-slate-400 dark:placeholder-slate-500 transition-all" placeholder="e.g. Summer in Santorini" type="text"/>
</div>
<div class="mt-8 overflow-x-auto no-scrollbar -mx-6 px-6">
<div class="flex gap-4">
<button class="flex-shrink-0 w-24 h-24 bg-primary text-white rounded-3xl flex flex-col items-center justify-center shadow-lg shadow-primary/25 active:scale-95 transition-all">
<span class="text-xs font-medium opacity-80 uppercase tracking-widest">Day</span>
<span class="text-2xl font-bold">01</span>
</button>
<button class="flex-shrink-0 w-24 h-24 bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 rounded-3xl flex flex-col items-center justify-center border border-slate-100 dark:border-slate-700 hover:border-primary/30 transition-all active:scale-95">
<span class="text-xs font-medium uppercase tracking-widest">Day</span>
<span class="text-2xl font-bold">02</span>
</button>
<button class="flex-shrink-0 w-24 h-24 bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 rounded-3xl flex flex-col items-center justify-center border border-slate-100 dark:border-slate-700 hover:border-primary/30 transition-all active:scale-95">
<span class="text-xs font-medium uppercase tracking-widest">Day</span>
<span class="text-2xl font-bold">03</span>
</button>
<button class="flex-shrink-0 w-24 h-24 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-3xl flex items-center justify-center text-slate-300 dark:text-slate-600 hover:border-primary/50 hover:text-primary transition-all active:scale-95">
<span class="material-icons-round text-3xl">add</span>
</button>
</div>
</div>
<div class="mt-10 relative">
<div class="absolute left-6 top-6 bottom-6 w-0.5 bg-slate-100 dark:bg-slate-800"></div>
<div class="space-y-6">
<div class="flex items-start gap-4 relative">
<div class="z-10 w-12 h-12 rounded-2xl bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-primary border-4 border-white dark:border-slate-900 shadow-sm">
<span class="material-icons-round text-xl">hotel</span>
</div>
<div class="flex-1 bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700/50">
<h4 class="text-sm font-semibold text-slate-400 dark:text-slate-500">STAYING AT</h4>
<p class="text-slate-900 dark:text-slate-100 font-medium mt-1">Grace Santorini Hotel</p>
</div>
</div>
<div class="flex items-start gap-4 relative">
<div class="z-10 w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white border-4 border-white dark:border-slate-900 shadow-lg shadow-primary/20">
<span class="font-bold">1</span>
</div>
<div class="flex-1 bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 ring-1 ring-primary/10">
<div class="flex justify-between items-start">
<div>
<h3 class="font-bold text-lg text-slate-800 dark:text-slate-100">Oia Village</h3>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
                                        Iconic whitewashed buildings with blue domes. Perfect for sunset photography and walking around.
                                    </p>
</div>
<button class="text-slate-300 hover:text-red-500 transition-colors">
<span class="material-icons-round text-lg">more_vert</span>
</button>
</div>
</div>
</div>
<div class="flex items-start gap-4 relative">
<div class="z-10 w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 border-4 border-white dark:border-slate-900">
<span class="font-bold">2</span>
</div>
<button class="flex-1 text-left bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center gap-2 group">
<span class="material-icons-round text-slate-400 group-hover:text-primary transition-colors">add_location_alt</span>
<span class="text-slate-400 font-medium">Add a destination...</span>
</button>
</div>
</div>
</div>
</main>
<div class="absolute bottom-24 left-0 right-0 px-6 pointer-events-none">
<button class="w-full bg-primary hover:bg-sky-500 text-white font-bold py-4 rounded-3xl shadow-xl shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 pointer-events-auto">
<span>CREATE TRIP</span>
<span class="material-icons-round text-lg">arrow_forward</span>
</button>
</div>
<nav class="absolute bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg border-t border-slate-100 dark:border-slate-800 px-8 py-4 flex justify-between items-center z-20">
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors">
<span class="material-icons-round">home</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Home</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary relative">
<div class="absolute -top-1 w-8 h-1 bg-primary rounded-full"></div>
<span class="material-icons-round">map</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Plan</span>
</button>
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors">
<span class="material-icons-round">menu_book</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Guide</span>
</button>
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors">
<span class="material-icons-round">person_outline</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Profile</span>
</button>
</nav>
<div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full z-30"></div>
</div>

</body></html>
